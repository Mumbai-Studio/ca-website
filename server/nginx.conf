# Collaborative Architecture · nginx (a VPS or a dedicated server). Written by tools/build.js; set "root", the certificate lines
# and the PHP socket for your server. The folder in "root" is the contents of dist/.

map $http_accept $ca_md { default 0; "~*text/markdown" 1; }

server {
  listen 80; listen [::]:80;
  server_name collaborativearchitecture.com www.collaborativearchitecture.com;
  location /.well-known/acme-challenge/ { root /var/www/collaborativearchitecture.com; }
  location / { return 301 https://collaborativearchitecture.com$request_uri; }
}
server {
  listen 443 ssl; listen [::]:443 ssl; http2 on;
  server_name www.collaborativearchitecture.com;
  # ssl_certificate /etc/letsencrypt/live/collaborativearchitecture.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/collaborativearchitecture.com/privkey.pem;
  return 301 https://collaborativearchitecture.com$request_uri;
}
server {
  listen 443 ssl; listen [::]:443 ssl; http2 on;
  server_name collaborativearchitecture.com;
  # ssl_certificate /etc/letsencrypt/live/collaborativearchitecture.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/collaborativearchitecture.com/privkey.pem;
  root /var/www/collaborativearchitecture.com;
  index index.html;
  charset utf-8;
  error_page 404 410 /404.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' blob:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  gzip on; gzip_types text/css text/javascript application/javascript application/json application/xml text/plain text/markdown image/svg+xml application/manifest+json;

  types { text/html html; text/css css; text/javascript js; application/json json; application/xml xml; text/plain txt; text/markdown md; image/webp webp; image/png png; image/jpeg jpg jpeg; image/x-icon ico; video/mp4 mp4; font/woff2 woff2; application/manifest+json webmanifest; }

